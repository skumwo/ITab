{% extends 'base.html' %}

{% block content %}
  <h2>Удалить чат?</h2>
  <p>Вы уверены, что хотите удалить чат между {{ chat.buyer }} и {{ chat.seller }} о товаре "{{ chat.product.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'chat_list' %}">Отмена</a>
  </form>
{% endblock %}
